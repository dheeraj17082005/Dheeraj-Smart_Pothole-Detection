server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: always

spring:
  application:
    name: pothole-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/potholedb}
    username: ${SPRING_DATASOURCE_USERNAME:pothole_user}
    password: ${SPRING_DATASOURCE_PASSWORD:pothole_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: 5s
    read-timeout: 15s

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:minioadmin}}
  secret-key: ${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:minioadminpassword}}
  raw-bucket: ${MINIO_RAW_BUCKET:pothole-raw}
  annotated-bucket: ${MINIO_ANNOTATED_BUCKET:pothole-annotated}
  url-expiry-seconds: ${MEDIA_URL_EXPIRY_SECONDS:3600}
  auto-create-buckets: ${MINIO_AUTO_CREATE_BUCKETS:true}
